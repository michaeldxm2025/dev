<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Power Market — UtilityScope</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="nav-placeholder"></div>
<main style="padding-top:90px">
<div class="page-wrap">
  <section>
    <a href="../pages/markets.html" style="font-family:var(--mono);font-size:11px;color:var(--text3);text-decoration:none;letter-spacing:1px">← ALL MARKETS</a>
    <div id="market-content" style="margin-top:32px">Loading...</div>
  </section>
</div>
</main>
<div id="footer-placeholder"></div>
<script src="../js/nav.js"></script>
<script>
const SLUG = 'australia';
const INFO = {
  australia:{name:'Australia',flag:'🇦🇺',exchange:'AEMO',regulator:'AER / AEMO',type:'Competitive NEM',description:'Australia operates the National Electricity Market (NEM) — one of the longest interconnected power systems in the world, spanning Queensland, New South Wales, Victoria, South Australia and Tasmania. AEMO operates the market with 5-minute settlement. The transition to renewables is among the fastest in the world.',sources:['AEMO data portal (aemo.com.au)','AER quarterly reports','ASX-listed utility investor reports']},
  singapore:{name:'Singapore',flag:'🇸🇬',exchange:'EMA',regulator:'EMA / SP Group',type:'Regulated + wholesale',description:'Singapore operates a hybrid electricity market with a regulated network (SP Group) and competitive wholesale generation. The Energy Market Authority (EMA) oversees both. Singapore is actively pursuing electricity import interconnections with Malaysia, Indonesia and beyond as part of its regional energy hub ambitions.',sources:['EMA market information (ema.gov.sg)','SP Group disclosures','EMA system security reports']},
  korea:{name:'South Korea',flag:'🇰🇷',exchange:'KPX',regulator:'MOTIE / KPX',type:'Cost-based pool',description:'South Korea operates a cost-based pool market through KPX (Korea Power Exchange). KEPCO is the dominant integrated utility controlling transmission and distribution. The government has been expanding nuclear capacity while rolling out offshore wind, particularly in the Yellow Sea.',sources:['KPX electricity statistics (kpx.or.kr)','KEPCO annual reports','MOTIE energy policy announcements']},
  taiwan:{name:'Taiwan',flag:'🇹🇼',exchange:'TPC',regulator:'MOEA / Bureau of Energy',type:'Vertically integrated',description:'Taiwan Power Company operates as a vertically integrated state utility with a near-monopoly on generation, transmission and distribution. The government has set ambitious offshore wind targets as part of a nuclear phase-out policy. Grid adequacy is a persistent concern.',sources:['Taiwan open data portal (data.gov.tw)','Bureau of Energy (moeaboe.gov.tw)','TPC operational disclosures']}
};
const d = INFO[SLUG];
if (d) {
  document.title = d.name + ' Power Market — UtilityScope';
  document.getElementById('market-content').innerHTML =
    '<div style="display:flex;align-items:center;gap:16px;margin-bottom:24px">'
    + '<span style="font-size:52px">'+d.flag+'</span>'
    + '<div>'
    + '<div style="font-family:var(--mono);font-size:11px;color:var(--teal);letter-spacing:2px;text-transform:uppercase;margin-bottom:4px">'+d.exchange+' · '+d.regulator+'</div>'
    + '<h1 style="font-family:var(--serif);font-size:42px;font-weight:900;letter-spacing:-1px">'+d.name+'</h1>'
    + '</div></div>'
    + '<p style="font-size:16px;color:var(--text2);line-height:1.7;max-width:680px;margin-bottom:32px">'+d.description+'</p>'
    + '<div class="card" style="max-width:480px;margin-bottom:32px">'
    + '<div style="font-family:var(--mono);font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);margin-bottom:14px">Key data sources</div>'
    + d.sources.map(function(s){return '<div style="font-size:13px;color:var(--text2);padding:6px 0;border-bottom:1px solid var(--border)">'+s+'</div>';}).join('')
    + '</div>'
    + '<div style="background:var(--bg2);border:1px solid var(--border2);border-radius:10px;padding:32px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:20px;max-width:680px">'
    + '<div><h3 style="font-family:var(--serif);font-size:18px;font-weight:700;margin-bottom:6px">Full market page coming soon</h3>'
    + '<p style="color:var(--text2);font-size:14px">Detailed price history, grid data and utility profiles for '+d.name+' are in development.</p></div>'
    + '<a href="../pages/newsletter.html" class="btn btn-primary">Notify me \u2192</a>'
    + '</div>';
}
</script>
</body>
</html>
